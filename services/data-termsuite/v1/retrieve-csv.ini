# Entrypoint output format
mimeType = text/csv

# OpenAPI Documentation - JSON format (dot notation)
post.operationId = post-v1-retrieve-csv
post.description = Récupération d'un résultat produit sous forme d'un flux CSV
post.summary = Les traitements étant asynchrones le résultat, une fois créé, doit être récupéré par cette route
post.tags.0 = data-termsuite
post.responses.default.description = Fichier corpus en version CSV
post.requestBody.required = true

post.requestBody.content.text/csv.example.0.value = EkqfSn4S2
post.responses.default.content.text/csv.schema.type = string
post.responses.default.content.text/csv.example = "key","pattern","pilot","freq","spec","dFreq","tfIdf"\n"n: sediment","N","sediments","10","4.61","5","2"\n"nn: proto-paratethys sea","N N","proto-Paratethys Sea","9","4.56","1","9"\n"a: glacial","A","glacial","7","4.46","5","1.4"\n"n: mmes","N","MMEs","7","4.46","1","7"\n"a: tropical","A","tropical","7","4.46","2","3.5"\n"n: precipitation","N","precipitation","7","4.46","3","2.33"\n"n: genus","N","genus","7","4.46","2","3.5"\n"n: obliquiloculata","N","obliquiloculata","7","4.46","1","7"\n"n: telescopus","N","Telescopus","6","4.39","1","6"\n"nn: clay mineral","N N","clay minerals","6","4.39","1","6"

[use]
plugin = basics

[JSONParse]
separator = *

[exchange]
value = get('value')

[FILELoad]
location = /tmp/retrieve

[TARExtract]
compress = true
path = */*.json

[exchange]
value = self().mapValues(value => typeof value === 'object' ? JSON.stringify(value) : value)

[CSVString]
separator = fix(',')
format = strict
