# OpenAPI Documentation - JSON format (dot notation)
mimeType = application/json

post.operationId = post-v1-detect
post.summary = Ws détectant les infrastructures de recherches dans un texte
post.description = Web service détectant les infrastructures de recherches françaises et européennes dans un texte en anglais ou en français. Extrait à partir d'une liste, avec une notion de gestion de casse.
post.tags.0 = infra-ner
post.requestBody.content.application/json.schema.$ref = #/components/schemas/JSONStream
post.requestBody.required = true
post.responses.default.content.application/json.schema.$ref =  #/components/schemas/JSONStream
post.responses.default.description = Le champ `value` contient les infrastructures détectées
post.parameters.0.description = Indenter le JSON résultant
post.parameters.0.in = query
post.parameters.0.name = indent
post.parameters.0.schema.type = boolean

[use]
plugin = @ezs/spawn
plugin = @ezs/basics

[JSONParse]
separator = *

[expand]
path = value
size = 100

[expand/exec]
# command should be executable !
command = ./v1/detect.py

[dump]
indent = env('indent', false)