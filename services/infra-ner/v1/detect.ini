mimeType = application/json

post.operationId = post-v1-detect
post.summary = Infra-ner détecte les infrastructures de recherche dans un texte
post.description = Web service détectant les infrastructures de recherche françaises et européennes dans un texte en anglais ou en français. Extrait à partir d'une liste, avec une notion de gestion de casse.
post.tags.0 = infra-ner
