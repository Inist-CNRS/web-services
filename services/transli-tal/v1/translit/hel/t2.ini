# OpenAPI Documentation - JSON format (dot notation)
mimeType = application/json

post.operationId = post-v1-translit-hel-t2
post.summary = Translittérer de grec en latin (ISO 843 + diphtongues)
post.description = Translittère une chaîne de caractères grecs en une chaîne de caractères latins suivant la norme ISO 843 avec des règles supplémentaires sur les diphtongues.
post.tags.0 = transli-tal
post.requestBody.content.application/json.schema.$ref = #/components/schemas/JSONStream
post.requestBody.required = true
post.responses.default.content.application/json.schema.$ref =  #/components/schemas/JSONStream
post.responses.default.description = Les caractères grecs sont remplacés par leurs équivalents latins.
post.parameters.0.description = Indenter le JSON résultant
post.parameters.0.in = query
post.parameters.0.name = indent
post.parameters.0.schema.type = boolean

[use]
plugin = @ezs/spawn
plugin = @ezs/basics

[JSONParse]
separator = *

[expand]
path = value
size = 100

[expand/exec]
# command should be executable !
command = ./v1/translit/hel/t2/translit_grek.py

[dump]
indent = env('indent', false)
