[use]
# exec
plugin = @ezs/spawn
# JSONParse
plugin = @ezs/basics

[JSONParse]
separator = *

[expand]
path = value
size = 100

[expand/exec]
# WARNING
# Command should be executable: chmod +x path/to/python/program.py
# Shebang should be /usr/bin/env python3
command = ./v1/ror/get-id.py

[dump]
indent = env('indent', false)
