# Entrypoint output format
mimeType = application/rdf+xml
extension = rdf

# OpenAPI Documentation - JSON format (dot notation)
post.operationId = post-v1-retrieve-rdf
post.summary = Récupération du fichier d'alignements (RDF/XML)
post.description = Les traitements étant asynchrones, le fichier d'alignements produit est récupéré par cette route, une fois le traitement terminé
post.tags.0 = retrieves
post.responses.default.description = Fichier d'alignements SKOS (mapping properties : exactMatch, closeMatch, broadMatch, narrowMatch, relatedMatch)
post.responses.default.content.application/rdf+xml.schema.type = string
post.requestBody.content.application/json.example.0.value = xMkWJX7GU
post.requestBody.content.application/json.schema.$ref = #/components/schemas/JSONStream
post.requestBody.required = true

[use]
plugin = basics

[JSONParse]
separator = *

[exchange]
value = get('value')

[FILELoad]
location = /tmp/retrieve

[TARExtract]
compress = true
path = */alignments.rdf
json = false
