# Entrypoint output format
mimeType = application/json

# OpenAPI Documentation - JSON format (dot notation)
post.operationId = post-v1-retrieve-report
post.summary = Récupération du rapport JSON d'un alignement
post.description = Statistiques du traitement (counts par relation, concepts non alignés, stats LLM, durée)
post.tags.0 = retrieves
post.responses.default.content.application/json.schema.type = object
post.requestBody.content.application/json.example.0.value = xMkWJX7GU
post.requestBody.content.application/json.schema.$ref = #/components/schemas/JSONStream
post.requestBody.required = true

[use]
plugin = basics

[JSONParse]
separator = *

[exchange]
value = get('value')

[FILELoad]
location = /tmp/retrieve

[TARExtract]
compress = true
path = */report.json
json = true
