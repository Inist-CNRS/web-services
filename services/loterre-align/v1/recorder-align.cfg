[use]
plugin = basics
plugin = analytics

[singleton]
[singleton/combine]
primer = One first result received
file = timestamp.cfg

[metrics]
bucket = recorder

# Le résultat (tar.gz) a déjà été écrit par run-align.sh dans /tmp/retrieve/<identifier>.tar.gz
# On signale juste la fin via le webhook de succès
[swing]
test = env('headers.x-webhook-success').startsWith('http')

[swing/replace]
path = url
value = env('headers.x-webhook-success')
path = body
value = self().pick(['id', 'value']).set('identifier', env('identifier')).set('generator', env('generator')).set('state', 'ready')

[swing/URLFetch]
url = env('headers.x-webhook-success').trim()
path = body
headers = Content-Type:application/json
retries = 5
timeout = 30000

[swing/combine]
primer = WebHook triggered
file = timestamp.cfg

[combine]
primer = Process completed
file = timestamp.cfg
