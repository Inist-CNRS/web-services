[use]
plugin = basics

# Corps = tableau JSON à un seul élément : [{\"skos\": \"<rdf:RDF...>\"}] si upload, [{}] sinon
[JSONParse]
separator = *

# Un seul traitement par requête
[singleton]

[singleton/env]
path = pid
value = fix(`PID${Date.now()}`)

[singleton/identify]
path = env('pid')

[singleton/env]
path = identifier
value = get(env('pid')).replace('uid:/', '')

[singleton/exchange]
value = self().omit([env('pid')])

[metrics]
bucket = charger

[combine]
primer = Data loaded
file = timestamp.cfg
