# Entrypoint output format
mimeType = application/json

# OpenAPI Documentation - JSON format (dot notation)
post.operationId = post-v1-align
post.summary = Alignement asynchrone de ressources SKOS avec Loterre
post.description = Aligne une ressource SKOS téléversée avec un vocabulaire Loterre, ou deux vocabulaires Loterre (SBERT + LLM, CPU). Traitement asynchrone : la requête renvoie un identifiant (token), le résultat (alignments.rdf + report.json) se récupère via /v1/retrieve-rdf, /v1/retrieve-report, /v1/retrieve.
post.tags.0 = loterre-align
post.requestBody.content.application/json.schema.$ref = #/components/schemas/JSONStream
post.requestBody.required = true
post.responses.default.description = Identifiant du traitement (token) pour récupérer le résultat via les routes /v1/retrieve*
post.parameters.0.description = Source : loterreID:CODE (vocabulaire Loterre) ou file (ressource téléversée dans le corps)
post.parameters.0.in = query
post.parameters.0.name = source
post.parameters.0.required = true
post.parameters.0.schema.type = string
post.parameters.0.schema.example = loterreID:P66
post.parameters.1.description = Cible : loterreID:CODE ou file
post.parameters.1.in = query
post.parameters.1.name = target
post.parameters.1.required = true
post.parameters.1.schema.type = string
post.parameters.1.schema.example = file
post.parameters.2.description = Langues préférées, ordre de priorité (passé à align.py --lang)
post.parameters.2.in = query
post.parameters.2.name = lang
post.parameters.2.schema.type = string
post.parameters.2.schema.default = fr,en
post.parameters.3.description = Score minimal SBERT (align.py --min_score)
post.parameters.3.in = query
post.parameters.3.name = min_score
post.parameters.3.schema.type = number
post.parameters.3.schema.default = 0.7
post.parameters.4.description = Nombre de candidats par concept (align.py --top_k)
post.parameters.4.in = query
post.parameters.4.name = top_k
post.parameters.4.schema.type = integer
post.parameters.4.schema.default = 5
post.parameters.5.description = Ne pas raffiner en broader/narrower (align.py --no-hierarchy)
post.parameters.5.in = query
post.parameters.5.name = no_hierarchy
post.parameters.5.schema.type = boolean
post.parameters.6.description = Durée max du traitement en minutes (0 = illimité)
post.parameters.6.in = query
post.parameters.6.name = max_minutes
post.parameters.6.schema.type = integer
post.parameters.6.schema.default = 0
post.parameters.7.description = Indenter le JSON résultant
post.parameters.7.in = query
post.parameters.7.name = indent
post.parameters.7.schema.type = boolean
post.parameters.8.description = URL pour signaler que le traitement est terminé
post.parameters.8.in = header
post.parameters.8.name = X-Webhook-Success
post.parameters.8.schema.type = string
post.parameters.8.schema.format = uri
post.parameters.8.required = false
post.parameters.9.description = URL pour signaler que le traitement a échoué
post.parameters.9.in = header
post.parameters.9.name = X-Webhook-Failure
post.parameters.9.schema.type = string
post.parameters.9.schema.format = uri
post.parameters.9.required = false

post.responses.default.content.application/json.example.0.id = loterre-align
post.responses.default.content.application/json.example.0.value = cEeFstsZi

[use]
plugin = @ezs/spawn

[env]
path = generator
value = loterre-align

# Step 1 : charge la requête (corps JSON [{\"skos\": ...}] ou [{}]) et générer le token
[delegate]
file = charger-skos.cfg

# Step 2 : traitement asynchrone détaché
[fork]
standalone = true
logger = logger.cfg

# Step 2.0 : bufferise pour répondre vite au client
[fork/delegate]
file = buffer.cfg

# Step 2.1 : lance align.py
[fork/exec]
command = ./v1/run-align.sh
args = env('identifier')
args = env('source')
args = env('target')
args = env('lang', 'fr,en')
args = env('min_score', '0.7')
args = env('top_k', '5')
args = env('no_hierarchy', 'false')
args = env('max_minutes', '0')

# Step 2.2 : enregistre le résultat et notifie le webhook
[fork/delegate]
file = recorder-align.cfg

# Step 3: renvoye immédiatement le token au client
[delegate]
file = recipient.cfg
