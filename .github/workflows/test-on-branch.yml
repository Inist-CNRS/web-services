# .github/workflows/docker-build-on-push.yml

name: Build & Test

on:
  push:
    branches:
      - "services/*/*"
    paths-ignore:
      - "**.md"
      - "**/swagger.json"

jobs:
  test-on-commit:
    # Do not switch to ubuntu-latest: Ubuntu 26.04 renamed `libxml2`
    # to `libxml2-16`, so the Hurl .deb cannot be installed there.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout from Git
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install Hurl
        run: |
          curl --location --remote-name https://github.com/Orange-OpenSource/hurl/releases/download/8.1.0/hurl_8.1.0_amd64.deb
          sudo apt-get update
          sudo apt-get install --yes ./hurl_8.1.0_amd64.deb
          hurl --version

      - name: Build .env from Github Actions secrets
        shell: bash
        run: |
          bin/create-env.sh ${{ github.ref_name }} ${{ secrets.WEBDAV_LOGIN }} ${{ secrets.WEBDAV_PASSWORD }} ${{ secrets.WEBDAV_URL }} ${{secrets.OPENALEX_API_KEY}} ${{secrets.UNPAYWALL_API_KEY}} ${{secrets.CROSSREF_API_KEY}} ${{secrets.LIBRARIES_IO_API_KEY}} ${{secrets.ORCID_CLIENT_ID}} ${{secrets.ORCID_SECRET}} ${{secrets.ILAAS_API_KEY}}
          ls -l services/*/.env

      - name: Build Docker Image & Test
        shell: bash
        run: |
          bin/test-on-branch.sh ${{ github.ref_name }}
